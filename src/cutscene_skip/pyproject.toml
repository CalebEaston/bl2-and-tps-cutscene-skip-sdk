[project]
name = "cutscene_skip"
version = "0.1"
authors = [{ name = "CalebEaston" }]
description = """\
For Borderlands 2 and Borderlands: The Pre-Sequel (the Pre-Sequel side should work but is \
untested so far). Skips cutscenes: turn on Always Skip Cutscenes to skip every one as it starts, \
or bind the Skip Cutscene key and press it during a cutscene.
"""

[project.urls]
Changelog = "https://github.com/CalebEaston/bl2-and-tps-cutscene-skip-sdk/blob/main/src/cutscene_skip/Readme.md"

[tool.sdkmod]
name = "Cutscene Skip"
download = "https://github.com/CalebEaston/bl2-and-tps-cutscene-skip-sdk/releases/latest"
supported_games = ["BL2", "TPS"]
coop_support = "HostOnly"
